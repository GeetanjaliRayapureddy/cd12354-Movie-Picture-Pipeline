name: Backend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - "starter/backend/**"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 490976329066.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER_NAME: cluster
  IMAGE_REPO: backend

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install dependencies
        working-directory: starter/backend
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv install --dev

      - name: Run lint
        working-directory: starter/backend
        run: pipenv run lint

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: starter/backend/Pipfile.lock

      - name: Install dependencies
        working-directory: starter/backend
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
          pipenv install --dev

      - name: Run tests
        working-directory: starter/backend
        run: pipenv run test

  build-and-push:
    runs-on: self-hosted

    needs:
      - lint
      - test

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Build Docker image
        working-directory: starter/backend
        run: |
          docker build --tag "$ECR_REGISTRY/$IMAGE_REPO:${{ steps.vars.outputs.image_tag }}" .

      - name: Push image to ECR
        run: |
          docker push "$ECR_REGISTRY/$IMAGE_REPO:${{ steps.vars.outputs.image_tag }}"

  deploy:
    runs-on: self-hosted

    needs:
      - build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Install kustomize
        working-directory: starter/backend/k8s
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash

      - name: Set image in kustomize
        working-directory: starter/backend/k8s
        run: |
          ./kustomize edit set image backend="$ECR_REGISTRY/$IMAGE_REPO:${{ needs.build-and-push.outputs.image_tag }}"

      - name: Deploy to EKS
        working-directory: starter/backend/k8s
        run: |
          kubectl apply -k .
          kubectl rollout status deployment/backend --timeout=120s