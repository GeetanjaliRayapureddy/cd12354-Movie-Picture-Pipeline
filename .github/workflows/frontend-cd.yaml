name: Frontend Continuous Deployment

on:
  push:
    branches:
      - main
    paths:
      - "starter/frontend/**"
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  IMAGE_REPO: frontend
  REACT_APP_MOVIE_API_URL: http://a99e827cf0a5f49a785c10fe8d359efd-947767413.us-east-1.elb.amazonaws.com

jobs:
  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "starter/frontend/.nvmrc"
          cache: npm
          cache-dependency-path: "starter/frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "starter/frontend/.nvmrc"
          cache: npm
          cache-dependency-path: "starter/frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

  build-and-push:
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        working-directory: starter/frontend
        run: |
          docker build \
            --build-arg REACT_APP_MOVIE_API_URL="${REACT_APP_MOVIE_API_URL}" \
            --tag "$ECR_REGISTRY/$IMAGE_REPO:${{ steps.vars.outputs.image_tag }}" .

      - name: Push image to ECR
        run: |
          docker push "$ECR_REGISTRY/$IMAGE_REPO:${{ steps.vars.outputs.image_tag }}"

  deploy:
    runs-on: ubuntu-latest

    needs:
      - build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Install kustomize
        working-directory: starter/frontend/k8s
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash

      - name: Set image in kustomize
        working-directory: starter/frontend/k8s
        run: |
          ./kustomize edit set image frontend="$ECR_REGISTRY/$IMAGE_REPO:${{ needs.build-and-push.outputs.image_tag }}"

      - name: Deploy to EKS
        working-directory: starter/frontend/k8s
        run: |
          kubectl apply -k .
          kubectl rollout status deployment/frontend --timeout=120s

      - name: Verify deployment (proof of automated deploy)
        run: |
          echo "=== Deployment timestamp ==="
          date -u
          echo ""
          echo "=== Image tag deployed by this run ==="
          echo "${{ needs.build-and-push.outputs.image_tag }}"
          echo ""
          echo "=== Running pods (note AGE/creation time) ==="
          kubectl get pods -o wide
          echo ""
          echo "=== Deployed image on cluster ==="
          kubectl get deployment frontend -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          echo ""
          echo "=== Frontend service URL ==="
          FRONTEND_URL=$(kubectl get svc frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          echo "http://$FRONTEND_URL"
          echo ""
          echo "=== Waiting for LoadBalancer to be reachable ==="
          sleep 30
          echo "=== Live response from frontend (proof app is serving content) ==="
          curl -sSf "http://$FRONTEND_URL" | head -c 1000